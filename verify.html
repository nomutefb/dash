<!DOCTYPE html> <html lang="ko"><head><meta charset="UTF-8"><title>판매현황 차트 검증 하네스</title> <style> body{font:13px/1.5 system-ui,sans-serif;margin:0;background:#161a22;color:#e6e9f0;padding:14px} h1{font-size:16px;margin:0 0 4px} .sub{color:#8b93a5;margin:0 0 10px;font-size:12px} button{font:600 13px system-ui;padding:7px 14px;border-radius:8px;border:1px solid #3a4152;background:#232a38;color:#e6e9f0;cursor:pointer;margin-right:6px} button:disabled{opacity:.45;cursor:default} #run{background:#4f5df0;border-color:#4f5df0} table{border-collapse:collapse;margin:12px 0;width:100%;max-width:980px} th,td{border:1px solid #333b4d;padding:6px 9px;text-align:left;font-size:12.5px} th{background:#1e2430;color:#aeb6c8} .ok{color:#4ade80;font-weight:700} .bad{color:#f87171;font-weight:700} .info{color:#fbbf24} #log{color:#8b93a5;font-size:12px;white-space:pre-wrap} iframe{border:2px solid #3a4152;border-radius:8px;display:block;background:#fff} .small{font-size:11px;color:#6b7280} </style></head><body> <h1>판매현황 차트 자동 검증 <span class="small">(v130 하네스 · 260814)</span></h1> <p class="sub">뷰포트 4종(500·600·700·990px)에서 standalone.html을 새로 로드해 사업결과비교 3개 차트를 실측한다. 합격 기준(렌더 정확성): ①Plotly 내부 높이=칸 높이(레이아웃 단위, 앱 줌 무관) ②선 프레임 이탈 0. 차트 하단이 화면 밖이면 "스크롤 필요"로 정보만 표시한다(높이 정책은 운영자 결정 사항).</p> <div><button id="run">▶ 전체 실행 (약 1분)</button><button data-h="500">500</button><button data-h="600">600</button><button data-h="700">700</button><button data-h="990">990</button></div> <div id="out"></div><div id="log"></div> <iframe id="f" style="width:1400px;height:600px"></iframe> <script> var OUT=document.getElementById('out'),LOG=document.getElementById('log'),F=document.getElementById('f'),N=0,ROWS=[]; function log(s){LOG.textContent+=s+'\n';} function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});} async function loadAt(h){ F.style.height=h+'px'; F.src='standalone.html?verify='+(++N); await new Promise(function(res){F.onload=res;}); await sleep(8000); var d=F.contentDocument; var nav=[].filter.call(d.querySelectorAll('a,button,div,span,li'),function(e){return e.childElementCount===0&&e.textContent.trim()==='판매 현황';}); if(nav.length)nav[0].click(); await sleep(3200); d.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'})); await sleep(600); } function measure(){ var d=F.contentDocument,w=F.contentWindow,out={winH:w.innerHeight,charts:{}}; var bx=d.querySelector('#biz-main [data-bizmbox]'); out.boxH=bx?(bx.style.height||'(미설정)'):'(박스 없음)'; try{var bw=d.getElementById('body-wrap');var z=bw?d.defaultView.getComputedStyle(bw).zoom:'1';if(z&&z!=='1')out.boxH+=' @줌'+z;}catch(_e){} ['bizm-chart','bizm-ex-chart','bizm-edu-chart'].forEach(function(id){ var el=d.getElementById(id); if(!el){out.charts[id]=null;return;} var r=el.getBoundingClientRect(),fl=el._fullLayout||{},pa=el.querySelector('.plot'),esc=0; if(pa){var pr=pa.getBoundingClientRect();[].forEach.call(el.querySelectorAll('.scatterlayer .trace path'),function(p){var b=p.getBoundingClientRect();if(b.top<pr.top-3||b.bottom>pr.bottom+35)esc++;});} out.charts[id]={divH:el.offsetHeight,layoutH:fl.height||0,over:Math.round(r.bottom-w.innerHeight),esc:esc}; }); return out; } function judge(h,m){ var dormant=(m.boxH==='(미설정)'); var cells='',pass=true,scroll=false,names={'bizm-chart':'공연','bizm-ex-chart':'전시','bizm-edu-chart':'교육'}; ['bizm-chart','bizm-ex-chart','bizm-edu-chart'].forEach(function(id){ var c=m.charts[id]; if(!c){cells+='<td class="bad">차트 없음</td>';pass=false;return;} var mOk=Math.abs(c.layoutH-c.divH)<=3, eOk=c.esc===0, vis=c.over<=2, ok=mOk&&eOk; if(!ok)pass=false; if(!vis)scroll=true; cells+='<td class="'+(ok?(vis?'ok':'info'):'bad')+'">'+names[id]+' '+c.divH+'px' +(mOk?'':' ⚠크기'+c.layoutH)+(vis?'':' ⚠하단+'+c.over)+(eOk?'':' ⚠이탈'+c.esc)+'</td>'; }); var verdict= pass? ('<span class="ok">✅ 렌더 정상</span>'+(scroll?' <span class="info">· 스크롤 필요</span>':'')) : '<span class="bad">❌ 렌더 이상</span>'; if(dormant) verdict+=' <span class="info">(박스 미발동)</span>'; return '<tr><td>'+h+'px</td><td>'+m.boxH+'</td>'+cells+'<td>'+verdict+'</td></tr>'; } function render(){OUT.innerHTML='<table><tr><th>뷰포트</th><th>박스</th><th>공연</th><th>전시</th><th>교육</th><th>판정</th></tr>'+ROWS.join('')+'</table>';} async function runOne(h){log('· '+h+'px 로드 중...');await loadAt(h);var m=measure();ROWS.push(judge(h,m));render();log('  → 완료');} document.getElementById('run').onclick=async function(){ this.disabled=true;ROWS=[];LOG.textContent=''; for(var i=0;i<4;i++){await runOne([500,600,700,990][i]);} log('전체 완료. 990 상태로 종료.');this.disabled=false; }; [].forEach.call(document.querySelectorAll('button[data-h]'),function(b){ b.onclick=async function(){b.disabled=true;await runOne(+b.dataset.h);b.disabled=false;}; }); </script></body></html>
