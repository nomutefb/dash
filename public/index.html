<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>예울마루 대시보드 · 미리보기</title>
  <link rel="icon" href="./favicon.ico">
  <style>
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{display:flex;flex-direction:column;background:#f4f0f6;color:#343149;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    header{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;min-height:46px;background:#f9f7fc;border-bottom:1px solid #ddd7ea;font-size:14px;line-height:1.5;text-align:center;flex-wrap:wrap}
    strong{color:#5146bb}
    iframe{display:block;width:100%;flex:1;min-height:0;border:0}
    @media(max-width:480px){header{gap:3px;font-size:13px}header span{flex-basis:100%}}
  </style>
</head>
<body>
  <header><strong>이전본 미리보기</strong><span>로그인 화면을 볼 수 있어요. 로그인과 데이터 연동은 준비 중입니다.</span></header>
  <iframe src="./standalone.html" title="예울마루 대시보드 로그인 화면" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe>
</body>
</html>
